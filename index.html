<body>
<canvas id="game"></canvas>
<div id="floaters"></div>

<div id="hud" style="display:none">
  <div id="obj"><div id="objtxt"></div><div id="objsub"></div></div>
  <div id="tasks"></div>
  <div id="bigcount"></div>
  <div id="vignette"></div>
  <div id="topright">
    <div id="money">$0</div>
    <div id="heat"><span class="hl">TOWN HEAT</span><div class="hb"><i id="heatfill"></i></div><span id="heatlabel"></span></div>
    <div id="mrep"><span class="hl">MAFIA REP</span><div class="hb"><i id="mrepfill"></i></div><span id="mreplabel"></span></div>
    <div id="lvl"></div>
    <div id="phonebadge"></div>
  </div>
  <div id="law" style="display:none"></div>
  <div id="ticker"></div>
  <div id="banner"><div id="bannertxt"></div><div id="bannersub"></div></div>
  <div id="alarm"></div>
  <div id="status" class="off"></div>
  <div id="prompt" style="display:none"></div>
  <div id="holdring" style="display:none"></div>
  <div id="prepkeys" style="display:none"></div>
  <div id="held" style="display:none"></div>
  <div id="toasts"></div>
  <div id="crosshair"></div>
</div>

<div id="sub"></div>
<div id="dialog"><div id="dname"></div><div id="dtext"></div><div id="dmore">E / CLICK</div></div>
<div id="panel"></div>
<input id="chatbox" maxlength="120" placeholder="Say something... (Enter)" style="display:none" autocomplete="off">
<div id="fade"><div id="fadetxt"></div><div id="fadesub"></div></div>
<div id="flash"></div>
<div class="bar top"></div><div class="bar bottom"></div>

<div id="title">
  <div class="tbox">
    <div class="logo"><span class="l1">PIZZA</span><span class="l2">UNDERGROUND</span></div>
    <div class="tag">Pizza has been banned. Nobody knows why.</div>
    <div class="trow">
      <label>Your name <input id="tname" maxlength="16" autocomplete="off"></label>
      <div class="looks" id="tlooks"></div>
    </div>
    <div class="tbtns">
      <button id="bcont" class="big">CONTINUE</button>
      <button id="bnew" class="big">NEW GAME</button>
      <button id="bhost">HOST CO-OP</button>
      <div class="join"><input id="tcode" maxlength="5" placeholder="CODE" autocomplete="off"><button id="bjoin">JOIN CO-OP</button></div>
    </div>
    <div id="tmsg"></div>
    <label class="tbleep"><input type="checkbox" id="tbleep"> Bleep the swearing</label>
    <div class="tfoot">1-4 players · WASD + mouse · co-op over the internet with a room code</div>
  </div>
</div>
<div id="loading">LOADING CRUMBVILLE...</div>
<noscript><p style="color:#fff;padding:20px">Pizza Underground needs JavaScript and WebGL.</p></noscript>
